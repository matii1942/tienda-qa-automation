# Scenarios tagged @known-bug reproduce defects documented in BUGS.md. They fail on
# purpose until the store is fixed, so the default run leaves them out.
# Override with: mvn test -Dcucumber.filter.tags="@known-bug"
cucumber.filter.tags=not @known-bug

cucumber.plugin=pretty, html:target/cucumber-report.html, json:target/cucumber.json
cucumber.publish.quiet=true

# UI scenarios share one browser per scenario and the store's database: run serially.
cucumber.execution.parallel.enabled=false
